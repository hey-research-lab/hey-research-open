# Lint, typecheck and fixture tests; a release for every v* tag.
# Nothing here has a network credential and no test reaches a provider.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scan
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The two npm packages build from this tree; releases are published from the private repository (2026-09-19).
      - run: pnpm --filter @hey-research/sdk build
      - run: pnpm --filter @hey-research/mcp build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
